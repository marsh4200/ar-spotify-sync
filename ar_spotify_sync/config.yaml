name: AR Spotify Sync
version: "0.2.2"
slug: ar_spotify_sync
description: One Spotify Connect speaker that plays in sync on several AirPlay devices
url: https://github.com/marsh4200/ar-spotify-sync
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# Host networking is required: mDNS discovery, AirPlay timing and the PTP
# clock (UDP 319/320) that AirPlay 2 speakers such as Sonos lock to.
host_network: true
# The speaker picker page, opened from the add-on page or the sidebar.
ingress: true
ingress_port: 8377
panel_icon: mdi:speaker-multiple
panel_title: Spotify Sync
options:
  device_name: TV Room Music
  bitrate: 320
  start_volume: 25
  idle_disconnect_seconds: 45
  normalisation: false
  log_level: info
  # Speakers are picked on the add-on's web page. Entries listed here are only
  # used until a selection has been saved there.
  speakers: []
schema:
  device_name: str
  bitrate: int(96,320)
  start_volume: int(0,100)
  idle_disconnect_seconds: int(5,100)
  normalisation: bool
  log_level: list(debug|info|warning)
  speakers:
    - name: str
      delay_ms: int
      volume_percent: int(0,100)
      protocol: list(auto|raop|airplay2|airplay2-compat)?
      buffer_ms: int(0,3000)?
      address: str?
      password: password?
